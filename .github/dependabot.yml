# Dependabot keeps dependencies up to date by opening pull requests.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # NuGet packages across the solution (all *.csproj discovered from the root).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    # Bundle low-risk updates into a single PR to cut noise; majors stay separate.
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions used in workflows current (applies once workflows exist).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      actions-all:
        update-types:
          - "minor"
          - "patch"
