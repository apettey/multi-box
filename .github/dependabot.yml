# Dependabot keeps dependencies up to date by opening pull requests.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Labels are intentionally not set here: Dependabot's default behavior applies (and
# creates, if missing) a "dependencies" label plus a per-ecosystem label. Naming a
# custom label instead would leave PRs unlabeled unless the label already exists.
version: 2
updates:
  # NuGet packages across the solution (all *.csproj discovered from the root).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    # Let a freshly published version settle for a week before proposing it.
    cooldown:
      default-days: 7
    # Bundle minor/patch into a single PR to cut noise; majors get their own PR.
    groups:
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions referenced in this repo's workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
