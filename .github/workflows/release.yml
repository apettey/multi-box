# Every merge to main is a release (AGENTS.md section 1). One run at a time, in merge order:
#   1. version  - next vX.Y.Z from the merged PRs' labels and files, plus the release notes: the
#                 shared next-version action from apettey/eve-contracts (the same code eve-contracts
#                 and hangarscope use; this repo has no copy)
#   2. build    - test, publish and Velopack-pack that version; only then tag the commit and
#                 publish the GitHub Release (shared workflow in apettey/eve-contracts)
#   3. finalize - the shared finalize-release action: release notes, a check that the Release is
#                 complete, and a "Release vX.Y.Z: changelog and version" commit recording it in
#                 CHANGELOG.md and the app's <Version> (ignored by step 1, so it never bumps again)
# Publishing the Release is the deploy: installed copies auto-update from it (Velopack).
# A deploy:manual label publishes it as a prerelease, which installed copies ignore until
# someone promotes it. A failed build leaves no tag; the next run picks the changes up again.
# Merges that land while a run is in progress share the next version (the newest pending run
# covers every merge since the last published tag; an older pending run is superseded, shown
# cancelled).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # A dispatch from another branch would tag and auto-update a commit that isn't on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # PR labels decide the bump and deploy:manual; must not fail open
    outputs:
      release: ${{ steps.next.outputs.release }}
      finalize: ${{ steps.next.outputs.finalize }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      prerelease: ${{ steps.next.outputs.prerelease }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: next
        uses: apettey/eve-contracts/.github/actions/next-version@3bdd873c355fe42dfe926c52dab0a4c6713dec0e # v1.1.5
        with:
          # the finalize job's bookkeeping commit touches only these; it never causes a release
          bookkeeping-paths: CHANGELOG.md,src/MultiBox.App/MultiBox.App.csproj
          app-name: MultiBox
          announcement-notes: list

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@3bdd873c355fe42dfe926c52dab0a4c6713dec0e # v1.1.5
    permissions:
      contents: write
    with:
      project: src/MultiBox.App/MultiBox.App.csproj
      app-name: MultiBox
      main-exe: MultiBox.exe
      test-project: tests/MultiBox.Core.Tests/MultiBox.Core.Tests.csproj
      version: ${{ needs.version.outputs.version }}
      release-tag: ${{ needs.version.outputs.tag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  # Also runs when the build was skipped because the Release is already published (a re-run or
  # dispatch after finalize failed), so notes and CHANGELOG.md are never silently left out.
  finalize:
    needs: [version, build]
    if: >-
      always() && needs.version.outputs.finalize == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release edit, and the bookkeeping push to main
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release notes, CHANGELOG.md and <Version>
        uses: apettey/eve-contracts/.github/actions/finalize-release@3bdd873c355fe42dfe926c52dab0a4c6713dec0e # v1.1.5
        with:
          tag: ${{ needs.version.outputs.tag }}
          notes: ${{ needs.version.outputs.notes }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          build-result: ${{ needs.build.result }}
          app-name: MultiBox
          changelog-file: CHANGELOG.md
          version-file: src/MultiBox.App/MultiBox.App.csproj
          branch: main
