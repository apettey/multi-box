# Every merge to main is a release (AGENTS.md section 1). One run at a time, in merge order:
#   1. version  - next vX.Y.Z from the merged PRs' labels and files (scripts/release/next-version.ps1)
#   2. build    - test, publish and Velopack-pack that version; only then tag the commit and
#                 publish the GitHub Release (shared workflow in apettey/eve-contracts)
#   3. finalize - release notes, plus a "Release vX.Y.Z" commit recording it in CHANGELOG.md
#                 and the app's <Version>
# Publishing the Release is the deploy: installed copies auto-update from it (Velopack).
# A deploy:manual label publishes it as a prerelease, which installed copies ignore until
# someone promotes it. A failed run leaves no tag; the next run picks the changes up again.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      prerelease: ${{ steps.next.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: next
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = ./scripts/release/next-version.ps1 -Ref $env:GITHUB_SHA
          "## Version`n`n$($r.Tag) - release: $($r.Release), $($r.Bump): $($r.Reason)" | Add-Content $env:GITHUB_STEP_SUMMARY

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: apettey/eve-contracts/.github/workflows/build-windows-app.yml@main
    permissions:
      contents: write
    with:
      project: src/MultiBox.App/MultiBox.App.csproj
      app-name: MultiBox
      main-exe: MultiBox.exe
      test-project: tests/MultiBox.Core.Tests/MultiBox.Core.Tests.csproj
      version: ${{ needs.version.outputs.version }}
      release-tag: ${{ needs.version.outputs.tag }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

  finalize:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release notes, CHANGELOG.md and <Version>
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git fetch -q --tags origin
          ./scripts/release/finalize.ps1 -Ref $env:GITHUB_SHA -Tag $env:TAG
